[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "racevla"
version = "0.1.0"
description = "Reinforcement-learning locomotion skills for the Unitree Go1 in MuJoCo, a foundation for vision-language guided skill switching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mujoco>=3.1", "gymnasium>=1.0", "stable-baselines3>=2.3", "torch>=2.0", "numpy", "imageio", "pillow", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["racevla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
